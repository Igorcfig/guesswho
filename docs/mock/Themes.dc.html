<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cara a Cara · Criar tema</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1B1446}
a{color:#FFC93C}a:hover{color:#FFE08A}
input::placeholder{color:#7A74A8}
</style>
</helmet>
<div style="min-height: 860px; width: 100%; box-sizing: border-box; background: #1B1446; color: #FFFFFF; font-family: Nunito, system-ui, sans-serif; padding: 20px 40px 40px; display: flex; flex-direction: column; gap: 24px;">
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; max-width: 1200px; width: 100%; margin: 0 auto;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none;">
      <svg width="40" height="40" viewBox="0 0 44 44" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="12" fill="#FFC93C"></rect><circle cx="16" cy="19" r="3" fill="#1B1446"></circle><circle cx="28" cy="19" r="3" fill="#1B1446"></circle><path d="M14 28 Q22 34 30 28" stroke="#1B1446" stroke-width="3" fill="none" stroke-linecap="round"></path></svg>
      <span style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 24px;">Cara a Cara</span>
    </a>
    <div style="display: flex; gap: 10px;">
      <button style="height: 48px; padding: 0 18px; border-radius: 14px; border: 2px solid #4A4190; background: transparent; color: #FFFFFF; font-weight: 800; font-size: 15px; font-family: Nunito, sans-serif; cursor: pointer;">Importar .zip</button>
      <button style="height: 48px; padding: 0 22px; border-radius: 14px; border: none; background: #FFC93C; color: #1B1446; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 18px; cursor: pointer; box-shadow: 0 4px 0 #C99A1E;">Salvar tema</button>
    </div>
  </header>

  <div style="max-width: 1200px; width: 100%; margin: 0 auto; background: #FFFFFF; color: #1B1446; border-radius: 28px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 10px 0 #0F0B2E;">
    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
      <div style="flex: 2 1 320px; display: flex; flex-direction: column; gap: 6px;">
        <label for="tname" style="font-weight: 800; font-size: 15px;">Nome do tema</label>
        <input id="tname" value="Bichos da fazenda" style="height: 52px; border-radius: 14px; border: 3px solid #E4E1F5; padding: 0 16px; font-size: 20px; font-weight: 800; font-family: Nunito, sans-serif; color: #1B1446; outline: none;">
      </div>
      <div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px;">
        <label for="vis" style="font-weight: 800; font-size: 15px;">Quem pode usar</label>
        <select id="vis" style="height: 52px; border-radius: 14px; border: 3px solid #E4E1F5; padding: 0 12px; font-size: 16px; font-weight: 700; font-family: Nunito, sans-serif; color: #1B1446; background: #FFFFFF;"><option>Todo mundo (público)</option><option>Só quem tem o link</option></select>
      </div>
      <div style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end;">
        <span style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 28px;">9 / 24</span>
        <span style="font-size: 13px; font-weight: 700; color: #5A5488;">mínimo de 12 personagens</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px;">
      <sc-for list="{{chars}}" as="c" hint-placeholder-count="9">
        <div style="border-radius: 18px; border: 3px solid #E4E1F5; padding: 8px; display: flex; flex-direction: column; gap: 8px; position: relative;">
          <div style="aspect-ratio: 1 / 1; border-radius: 12px; background: {{c.bg}}; display: flex; align-items: center; justify-content: center; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 34px; color: #1B1446;">{{c.initial}}</div>
          <label style="font-size: 12px; font-weight: 800; color: #5A5488; display: flex; flex-direction: column; gap: 4px;">Nome
            <input value="{{c.name}}" style="height: 38px; border-radius: 10px; border: 2px solid #E4E1F5; padding: 0 10px; font-size: 15px; font-weight: 800; font-family: Nunito, sans-serif; color: #1B1446; outline: none;">
          </label>
          <button aria-label="Remover {{c.name}}" style="position: absolute; top: 2px; right: 2px; width: 32px; height: 32px; border-radius: 16px; border: 2px solid #FFFFFF; background: #1B1446; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
      </sc-for>
      <button style="border-radius: 18px; border: 3px dashed #C9C3EA; background: #F8F7FF; min-height: 210px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #4A4570; font-weight: 800; font-size: 15px; font-family: Nunito, sans-serif; cursor: pointer; padding: 12px;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l4-4 4 4 3-3 5 5"></path><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="15.5" cy="8.5" r="1.5"></circle></svg>
        Arraste fotos aqui
        <span style="font-weight: 600; font-size: 13px; color: #5A5488;">PNG ou JPG, até 2 MB cada</span>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Mimosa','Pintado','Cacarejo','Toquinho','Lã','Ferradura','Quack','Bigode','Rabicó'];
    const bgs = ['#FFE7A3','#BFF0EA','#FFD3C2','#DCD3FF','#FFD0DD','#D6F5C9'];
    return {
      chars: names.map((name, i) => ({ name, initial: name.slice(0, 1), bg: bgs[i % bgs.length] }))
    };
  }
}
</script>
</body>
</html>
