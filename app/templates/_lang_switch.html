{# Language switcher: two inline SVG flags (Brazil / USA). The JS (i18n.js) wires up the clicks. #}
<div class="lang-switch" role="group" aria-label="{{ t('lang.group') }}" data-i18n-attr="aria-label:lang.group">
  <button type="button" class="lang-btn" data-lang-btn="pt" lang="pt-BR" aria-label="Português" title="Português" aria-pressed="{{ 'true' if lang() == 'pt' else 'false' }}">
    <svg class="flag" viewBox="0 0 28 20" width="28" height="20" aria-hidden="true" focusable="false">
      <rect width="28" height="20" fill="#009C3B"/>
      <path d="M14 2.2 25.4 10 14 17.8 2.6 10Z" fill="#FFDF00"/>
      <circle cx="14" cy="10" r="4.6" fill="#002776"/>
      <path d="M9.6 8.9c3-.9 6.1-.6 8.8.9" stroke="#fff" stroke-width="1.1" fill="none"/>
    </svg>
  </button>
  <button type="button" class="lang-btn" data-lang-btn="en" lang="en" aria-label="English" title="English" aria-pressed="{{ 'true' if lang() == 'en' else 'false' }}">
    <svg class="flag" viewBox="0 0 28 20" width="28" height="20" aria-hidden="true" focusable="false">
      <rect width="28" height="20" fill="#fff"/>
      <path d="M0 0h28v1.54H0zM0 3.08h28v1.54H0zM0 6.15h28v1.54H0zM0 9.23h28v1.54H0zM0 12.31h28v1.54H0zM0 15.38h28v1.54H0zM0 18.46h28V20H0z" fill="#B22234"/>
      <rect width="12" height="10.77" fill="#3C3B6E"/>
      <g fill="#fff"><circle cx="2" cy="1.8" r=".7"/><circle cx="6" cy="1.8" r=".7"/><circle cx="10" cy="1.8" r=".7"/><circle cx="4" cy="4" r=".7"/><circle cx="8" cy="4" r=".7"/><circle cx="2" cy="6.2" r=".7"/><circle cx="6" cy="6.2" r=".7"/><circle cx="10" cy="6.2" r=".7"/><circle cx="4" cy="8.6" r=".7"/><circle cx="8" cy="8.6" r=".7"/></g>
    </svg>
  </button>
</div>
