<!doctype html>
<html lang="{{ html_lang[lang()] }}" data-lang="{{ lang() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1B1446">
  <title>{% block title %}Cara a Cara{% endblock %}</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <script id="i18n-pages" type="application/json">{{ page_strings|tojson }}</script>
</head>
<body class="{% block body_class %}{% endblock %}"{% block body_attrs %}{% endblock %}>
  <a class="skip-link" href="#conteudo" data-i18n="skip">{{ t('skip') }}</a>
  {% block content %}{% endblock %}
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
