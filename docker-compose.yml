# Credentials and ports come from a .env file (never committed).
#   Dev:  cp .env.example .env            && docker compose up --build
#   Prod: cp .env.example .env.prod (edit) && docker compose --env-file .env.prod up -d --build
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # The app builds the database URL from these variables (escaped: the password may contain @ : / #).
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REPO_URL: ${REPO_URL:-https://github.com/Igorcfig/guesswho}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ avoids compose interpolation: the variables are read inside the container.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  uploads:
  pgdata:
