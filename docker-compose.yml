# Credenciais e portas vêm de um arquivo .env (nunca commitado).
#   Dev:  cp .env.example .env            && docker compose up --build
#   Prod: cp .env.example .env.prod (edite) && docker compose --env-file .env.prod up -d --build
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # O app monta a URL do banco a partir destas variáveis (com escape: a senha pode ter @ : / #).
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ evita a interpolação do compose: as variáveis são lidas dentro do container.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  uploads:
  pgdata:
