name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --output-format=github .

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    name: Docker compose (build + healthcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env a partir do exemplo
        run: cp .env.example .env
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - name: Build das imagens
        run: docker compose build
      - name: Subir app + Postgres
        run: docker compose up -d --wait --wait-timeout 120
      - name: Verificar /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then echo; exit 0; fi
            sleep 2
          done
          echo "App não respondeu em /healthz"
          exit 1
      - name: Logs dos containers
        if: always()
        run: docker compose logs --no-color
      - name: Derrubar
        if: always()
        run: docker compose down -v
